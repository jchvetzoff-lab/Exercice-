name: CI

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install pytest ruff bandit
      
      - name: Run tests
        run: python -m pytest -q
  
      - name: Ruff tests
        run : ruff check .
        
      - name: security scan
        run : python -m bandit -r payments.py tests/

